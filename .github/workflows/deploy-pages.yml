name: Deploy SCRAP PLANET iPhone QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout public QA payload
        uses: actions/checkout@v4

      - name: Verify SP-15 payload chunks
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/chunks.sha256 <<'EOF'
          253cbe2c5da24a8aa8300657f81e5e2a01b1c0e4cba8405aadbe3392165d8b64  payload/sp15v2.part00
          5fe5f4b705afce8dd2d4abda945c8dd13869616649ee26ff0a25ecd82f1859f6  payload/sp15v2.part01
          6b5377ab11de0b35b4dadc41cbf4b99590de99f500bdf28ca16969237b3a1109  payload/sp15v2.part02
          e61f17fa50906b9ce297b3ed69bab5f1bf405eba0fa1daea4326d91850228307  payload/sp15v2.part03
          1932ecd85d84271bae50a383d12d3e95709603fa631158e7f452f3696fb06e5e  payload/sp15v2.part04
          475d0f151d67a793204e5f59f89976ac7f6d9aa9bcd9868ee09491e7aad7714a  payload/sp15v2.part05
          6809e709e68fc57c58f7141459ec8ae5f50a2c4769e37ec1e0a5130036cf92f5  payload/sp15v2.part06
          837a96e9d6f3cbd176a23ae9a298d45d1807ed6b02477165d0903a77c448f2c8  payload/sp15v2.part07
          e10d67a3c2908fbf825128074e8074749333399ff89e0af5f518aee2890ae328  payload/sp15v2.part08
          75c5fd112dfd701c74cff6ed1fe92405282bc6f88af78347b8300f037fb3672f  payload/sp15v2.part09
          EOF
          sha256sum -c /tmp/chunks.sha256
          cat payload/sp15v2.part00 payload/sp15v2.part01 payload/sp15v2.part02 payload/sp15v2.part03 payload/sp15v2.part04 payload/sp15v2.part05 payload/sp15v2.part06 payload/sp15v2.part07 payload/sp15v2.part08 payload/sp15v2.part09 > /tmp/sp15.patch.b64
          echo '223b1e49f34ccf47cc023a62355cb004121e5f26e2568a4ae868d2c4e6da1764  /tmp/sp15.patch.b64' | sha256sum -c -
          base64 -d /tmp/sp15.patch.b64 > /tmp/sp15.patch.z
          echo 'c7012a7a2ebfc39fda4782a94361fab03fc19fdb6afb354864351406ed690c08  /tmp/sp15.patch.z' | sha256sum -c -

      - name: Assemble verified SP-15 Japanese Web QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          BASE='https://48wr9f4wgp-lab.github.io/-scrap-planet-qa'

          for f in index.html index.pck index.js index.wasm index.audio.position.worklet.js index.audio.worklet.js index.png index.icon.png index.apple-touch-icon.png; do
            curl -fL --retry 3 "$BASE/$f" -o "site/$f"
          done

          OLD_PCK='581360c3440df53ef5b4d8b6cd2bc44820980a20961bd488519b02699589f7e0'
          NEW_PCK='34048e925722740e156733047549e6b6ed67518804ac549bd961fc65a1dadeaa'
          CURRENT_PCK="$(sha256sum site/index.pck | awk '{print $1}')"

          if [ "$CURRENT_PCK" = "$OLD_PCK" ]; then
            python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct
          import zlib

          OLD_SHA = '581360c3440df53ef5b4d8b6cd2bc44820980a20961bd488519b02699589f7e0'
          NEW_SHA = '34048e925722740e156733047549e6b6ed67518804ac549bd961fc65a1dadeaa'

          old = Path('site/index.pck').read_bytes()
          if hashlib.sha256(old).hexdigest() != OLD_SHA:
              raise SystemExit('Live SP-14 PCK changed before SP-15 patching')

          patch = zlib.decompress(Path('/tmp/sp15.patch.z').read_bytes())
          if patch[:4] != b'SPP2':
              raise SystemExit('Unexpected SP-15 patch magic')

          pos = 4
          expected_size, op_count = struct.unpack_from('<II', patch, pos)
          pos += 8
          out = bytearray()
          for _ in range(op_count):
              op = patch[pos:pos + 1]
              pos += 1
              if op == b'C':
                  offset, length = struct.unpack_from('<II', patch, pos)
                  pos += 8
                  out += old[offset:offset + length]
              elif op == b'L':
                  length = struct.unpack_from('<I', patch, pos)[0]
                  pos += 4
                  out += patch[pos:pos + length]
                  pos += length
              else:
                  raise SystemExit('Unknown SP-15 patch opcode')

          if len(out) != expected_size:
              raise SystemExit(f'SP-15 PCK size mismatch: {len(out)} != {expected_size}')
          if hashlib.sha256(out).hexdigest() != NEW_SHA:
              raise SystemExit('SP-15 PCK SHA-256 mismatch after patching')
          Path('site/index.pck').write_bytes(out)
          PY
          elif [ "$CURRENT_PCK" = "$NEW_PCK" ]; then
            echo 'SP-15 PCK is already deployed; reusing it.'
          else
            echo "Unexpected live PCK hash: $CURRENT_PCK"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('site/index.html')
          text = path.read_text()
          text, count = re.subn(r'"index\.pck":\d+', '"index.pck":169200', text, count=1)
          if count != 1:
              raise SystemExit('Could not update SP-15 index.pck size in index.html')
          path.write_text(text)
          PY

          echo '34048e925722740e156733047549e6b6ed67518804ac549bd961fc65a1dadeaa  site/index.pck' | sha256sum -c -
          echo '2f9b3ea4896fd562f99277da458c988fd63fcef057c79ce881b768948f388f45  site/index.html' | sha256sum -c -
          echo '11ea19645368f8e73cf337b59cfd7ceeb4ebb51f7a3bbf77d1a5c3ddfedbc522  site/index.wasm' | sha256sum -c -
          echo 'ffc3898b59fba6f5af0c02f76e5ee526cc061e65c7d2d6f4f98186876cea15c4  site/index.js' | sha256sum -c -

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

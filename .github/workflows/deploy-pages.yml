name: Deploy SCRAP PLANET iPhone QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout public QA payload
        uses: actions/checkout@v4

      - name: Assemble verified SP-13 Web QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          BASE='https://48wr9f4wgp-lab.github.io/-scrap-planet-qa'

          for f in index.html index.pck index.js index.wasm index.audio.position.worklet.js index.audio.worklet.js index.png index.icon.png index.apple-touch-icon.png; do
            curl -fL --retry 3 "$BASE/$f" -o "site/$f"
          done

          OLD_PCK='715daa58133d08d719d77feb84a874e47bf2511a975b8a37834c7aea29fa4a70'
          NEW_PCK='86de569c4b19b67353aa3dbc4cec2cd1ea2f69f9cbd2a7b953ce4967a4e7cba7'
          CURRENT_PCK="$(sha256sum site/index.pck | awk '{print $1}')"

          if [ "$CURRENT_PCK" = "$OLD_PCK" ]; then
            cat payload/sp13.patch.b64.part* | base64 -d > /tmp/sp13.patch.z
            python3 - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          old = Path('site/index.pck').read_bytes()
          patch = zlib.decompress(Path('/tmp/sp13.patch.z').read_bytes())
          if patch[:4] != b'SPP1':
              raise SystemExit('Unexpected patch magic')

          pos = 4
          expected_size, op_count = struct.unpack_from('<II', patch, pos)
          pos += 8
          out = bytearray()

          for _ in range(op_count):
              op = patch[pos:pos + 1]
              pos += 1
              if op == b'C':
                  offset, length = struct.unpack_from('<II', patch, pos)
                  pos += 8
                  out += old[offset:offset + length]
              elif op == b'L':
                  length = struct.unpack_from('<I', patch, pos)[0]
                  pos += 4
                  out += patch[pos:pos + length]
                  pos += length
              else:
                  raise SystemExit('Unknown patch opcode')

          if len(out) != expected_size:
              raise SystemExit(f'Patched PCK size mismatch: {len(out)} != {expected_size}')

          Path('site/index.pck').write_bytes(out)
          PY
          elif [ "$CURRENT_PCK" = "$NEW_PCK" ]; then
            echo 'SP-13 PCK is already deployed; reusing it.'
          else
            echo "Unexpected live PCK hash: $CURRENT_PCK"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('site/index.html')
          text = path.read_text()
          text, count = re.subn(r'"index\.pck":\d+', '"index.pck":155872', text, count=1)
          if count != 1:
              raise SystemExit('Could not update index.pck size in index.html')
          path.write_text(text)
          PY

          echo '86de569c4b19b67353aa3dbc4cec2cd1ea2f69f9cbd2a7b953ce4967a4e7cba7  site/index.pck' | sha256sum -c -
          echo '28d8436cb49a9bae63766824b535486b63dfd9c4cbf0346042df0c4042677622  site/index.html' | sha256sum -c -
          echo '11ea19645368f8e73cf337b59cfd7ceeb4ebb51f7a3bbf77d1a5c3ddfedbc522  site/index.wasm' | sha256sum -c -
          echo 'ffc3898b59fba6f5af0c02f76e5ee526cc061e65c7d2d6f4f98186876cea15c4  site/index.js' | sha256sum -c -

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
